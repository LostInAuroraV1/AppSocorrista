name: Publicar site
on:
  push:
    branches: [main]
    paths: ['app/src/main/assets/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/src/main/assets
      - uses: actions/deploy-pages@v4
